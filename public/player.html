<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>행맨 - 플레이어</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; background: #f0f2f5; padding: 15px; max-width: 500px; margin: 0 auto; }
        .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .status-bar { display: flex; justify-content: space-between; font-weight: bold; font-size: 1.1rem; }
        .timer { color: #e67e22; font-size: 1.3rem; }
        .my-turn { border: 3px solid #2ecc71; }
        .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 10px; }
        .grid button { padding: 10px 0; font-weight: bold; }
        .hidden { display: none; }
        .slot { display: inline-block; width: 30px; height: 40px; border-bottom: 2px solid #333; font-size: 1.5rem; text-align: center; margin: 2px; }
    </style>
</head>
<body>

    <!-- 1. 입장 화면 -->
    <div id="loginArea" class="card">
        <h2>게임 참가</h2>
        <p>현재 대기자: <span id="currentPlayers">0</span>명</p>
        <input type="text" id="nicknameInput" placeholder="닉네임 입력" style="padding: 10px; width: 70%;">
        <button onclick="joinGame()" style="padding: 10px;">참가</button>
    </div>

    <!-- 2. 게임 메인 화면 -->
    <div id="gameArea" class="card hidden">
        <div class="status-bar">
            <span>남은 기회: <span id="myLives">❤️❤️❤️❤️❤️</span></span>
            <span class="timer">⏱️ <span id="timerVal">30</span>초</span>
        </div>
        <hr>
        <div id="turnNotice" style="text-align: center; font-weight: bold; margin: 10px 0;">대기 중...</div>
        
        <!-- 빈칸 현황판 -->
        <div style="text-align: center; margin: 20px 0;" id="slotsContainer"></div>

        <!-- 액션 버튼 -->
        <div id="actionBtns" class="hidden" style="text-align: center; margin-bottom: 10px;">
            <button onclick="passTurn()" style="background: #f39c12; color: white; padding: 8px 15px;">턴 넘기기(패스)</button>
        </div>

        <!-- 자모음 선택 패널 -->
        <div class="grid" id="charPanel"></div>

        <hr style="margin: 20px 0;">

        <!-- 정답 직접 도전 -->
        <div style="text-align: center;">
            <input type="text" id="answerInput" placeholder="단어 정답 입력">
            <button onclick="submitAnswer()">정답 제출</button>
            <div id="penaltyMsg" style="color: red; font-size: 0.85rem; margin-top: 5px;"></div>
        </div>
    </div>

    <script>
        const socket = io();
        let myName = '';
        let isMyTurn = false;

        const chars = ['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ','ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];

        // 버튼 생성
        const panel = document.getElementById('charPanel');
        chars.forEach(c => {
            const btn = document.createElement('button');
            btn.innerText = c;
            btn.onclick = () => tryChar(c);
            panel.appendChild(btn);
        });

        socket.on('player_count_update', count => {
            document.getElementById('currentPlayers').innerText = count;
        });

        function joinGame() {
            myName = document.getElementById('nicknameInput').value.trim();
            if(!myName) return alert('닉네임을 입력하세요!');
            socket.emit('join_game', myName);
        }

        socket.on('join_success', () => {
            document.getElementById('loginArea').classList.add('hidden');
            document.getElementById('gameArea').classList.remove('hidden');
        });

        socket.on('join_error', msg => alert(msg));

        socket.on('game_started', (data) => {
            // 자모음 빈칸 만들기
            const container = document.getElementById('slotsContainer');
            container.innerHTML = '';
            for(let i=0; i<data.decomposedCount; i++) {
                container.innerHTML += `<div class="slot">_</div>`;
            }
        });

        socket.on('turn_update', (data) => {
            isMyTurn = (data.currentTurnPlayer.name === myName);
            const notice = document.getElementById('turnNotice');
            const card = document.getElementById('gameArea');

            if(isMyTurn) {
                notice.innerText = "🎯 당신의 턴입니다! (자모음 선택)";
                notice.style.color = "#27ae60";
                card.classList.add('my-turn');
                document.getElementById('actionBtns').classList.remove('hidden');
            } else {
                notice.innerText = `⏳ ${data.currentTurnPlayer.name} 님의 턴 진행 중...`;
                notice.style.color = "#333";
                card.classList.remove('my-turn');
                document.getElementById('actionBtns').classList.add('hidden');
            }
        });

        socket.on('timer_tick', time => {
            document.getElementById('timerVal').innerText = time;
        });

        function tryChar(c) {
            if(!isMyTurn) return alert("당신의 턴이 아닙니다!");
            socket.emit('try_char', c);
        }

        function passTurn() {
            if(!isMyTurn) return;
            socket.emit('pass_turn');
        }

        function submitAnswer() {
            const ans = document.getElementById('answerInput').value.trim();
            if(!ans) return;
            socket.emit('try_answer', ans);
        }

        socket.on('player_status_update', (players) => {
            const me = players.find(p => p.name === myName);
            if(me) {
                document.getElementById('myLives').innerText = '❤️'.repeat(Math.max(0, me.lives));
            }
        });

        socket.on('answer_failed', (seconds) => {
            alert(`오답입니다! ${seconds}초 동안 정답에 재도전할 수 없습니다.`);
            startPenaltyTimer(seconds);
        });

        function startPenaltyTimer(sec) {
            const msg = document.getElementById('penaltyMsg');
            let left = sec;
            const interval = setInterval(() => {
                left--;
                msg.innerText = `정답 재도전 쿨타임: ${left}초 남음`;
                if(left <= 0) {
                    clearInterval(interval);
                    msg.innerText = '';
                }
            }, 1000);
        }

        socket.on('eliminated', () => {
            alert('기회를 모두 소진하여 탈락했습니다.');
            location.reload();
        });

        socket.on('game_won', (data) => {
            alert(`🎉 [${data.winner}] 님이 정답 [${data.word}]을(를) 맞췄습니다!`);
        });

        socket.on('game_reset', () => {
            alert('출제자가 게임을 초기화했습니다.');
            location.reload();
        });
    </script>
</body>
</html>
