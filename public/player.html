<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>플레이어 화면</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #eef2f5; }
        .box { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .slot-container { display: flex; gap: 6px; margin: 10px 0; flex-wrap: wrap; }
        .slot { width: 38px; height: 38px; border: 2px solid #444; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; background: #fff; }
        .keyboard { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 10px; }
        .btn { padding: 10px; font-size: 16px; font-weight: bold; cursor: pointer; border: 1px solid #ccc; background: #f0f0f0; border-radius: 4px; }
        .btn:disabled { background: #ddd; cursor: not-allowed; }
        .feedback { padding: 10px; border-radius: 4px; font-weight: bold; margin-top: 10px; }
        .hit { background-color: #d4edda; color: #155724; }
        .miss { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div id="loginArea" class="box">
        <h2>게임 참가</h2>
        <input type="text" id="playerName" placeholder="닉네임 입력">
        <button onclick="joinGame()">참가하기</button>
    </div>

    <div id="gameArea" style="display: none;">
        <div class="box">
            <h2 id="myInfo">-</h2>
            <p>남은 시간: <b id="timer">30</b>초 | 현재 턴: <b id="turnInfo">-</b></p>
            <div id="feedback" class="feedback" style="display: none;"></div>
        </div>

        <div class="box">
            <h3>단어 슬롯</h3>
            <div id="slotContainer" class="slot-container"></div>
        </div>

        <div class="box">
            <h3>자음/모음 선택</h3>
            <div id="keyboard" class="keyboard"></div>
            <br>
            <button class="btn" onclick="passTurn()">턴 넘기기</button>
        </div>

        <div class="box">
            <h3>정답 제출</h3>
            <input type="text" id="answerInput" placeholder="단어 전체 입력">
            <button onclick="submitAnswer()">제출</button>
            <p id="penaltyMsg" style="color: red;"></p>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myName = "";

        const CHARS = [
            'ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ',
            'ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'
        ];

        function joinGame() {
            const name = document.getElementById('playerName').value.trim();
            if(!name) return alert('닉네임을 입력하세요');
            myName = name;
            socket.emit('join_game', name);
        }

        socket.on('join_success', (player) => {
            document.getElementById('loginArea').style.display = 'none';
            document.getElementById('gameArea').style.display = 'block';
            document.getElementById('myInfo').textContent = `${player.name} (목숨: ${player.lives})`;
            initKeyboard();
        });

        function initKeyboard() {
            const kb = document.getElementById('keyboard');
            kb.innerHTML = '';
            CHARS.forEach(char => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.textContent = char;
                btn.onclick = () => socket.emit('try_char', char);
                kb.appendChild(btn);
            });
        }

        socket.on('game_started', (data) => {
            renderSlots(data.slots);
        });

        socket.on('board_update', (data) => {
            renderSlots(data.slots);
            const fb = document.getElementById('feedback');
            fb.style.display = 'block';
            if(data.hit) {
                fb.className = 'feedback hit';
                fb.textContent = `'${data.char}' 맞았습니다!`;
            } else {
                fb.className = 'feedback miss';
                fb.textContent = `'${data.char}' 틀렸습니다! (목숨 차감)`;
            }
        });

        socket.on('timer_tick', (time) => {
            document.getElementById('timer').textContent = time;
        });

        socket.on('turn_update', (data) => {
            const isMyTurn = data.currentTurnPlayer && data.currentTurnPlayer.name === myName;
            document.getElementById('turnInfo').textContent = data.currentTurnPlayer ? data.currentTurnPlayer.name : '-';
            
            const btns = document.querySelectorAll('.keyboard .btn');
            btns.forEach(btn => btn.disabled = !isMyTurn);
        });

        socket.on('player_status_update', (players) => {
            const me = players.find(p => p.name === myName);
            if(me) {
                document.getElementById('myInfo').textContent = `${me.name} (목숨: ${me.lives})`;
            }
        });

        function passTurn() { socket.emit('pass_turn'); }
        function submitAnswer() {
            const ans = document.getElementById('answerInput').value.trim();
            if(ans) socket.emit('try_answer', ans);
        }

        socket.on('answer_failed', (sec) => {
            document.getElementById('penaltyMsg').textContent = `정답 틀림! ${sec}초간 정답 입력 불가`;
        });

        socket.on('eliminated', () => {
            alert('목숨을 모두 잃어 탈락했습니다.');
        });

        socket.on('game_won', (data) => {
            alert(`축하합니다! ${data.winner}님이 정답 [${data.word}]을 맞췄습니다!`);
        });

        function renderSlots(slots) {
            const container = document.getElementById('slotContainer');
            container.innerHTML = '';
            slots.forEach(char => {
                const div = document.createElement('div');
                div.className = 'slot';
                div.textContent = char || '';
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
